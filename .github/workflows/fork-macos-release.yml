name: Fork macOS Release

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build_macos:
    name: Build macOS ${{ matrix.arch }}
    # Both arches build on the Apple Silicon runner; electron-builder and the
    # Rust toolchain cross-target x64 the same way upstream's release does.
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            rust_target: aarch64-apple-darwin
          - arch: x64
            rust_target: x86_64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install desktop dependencies
        run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Cache resource monitor
        id: resource_monitor_cache
        uses: actions/cache@v6
        with:
          path: native/resource-monitor/target/${{ matrix.rust_target }}/release/t3-resource-monitor
          key: resource-monitor-${{ matrix.rust_target }}-${{ hashFiles('native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}

      - name: Setup Rust
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ inputs.version }}"

      - name: Trust macOS signing certificate
        shell: bash
        env:
          MACOS_CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          MACOS_CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$MACOS_CSC_LINK" ]]; then
            echo "::error::MACOS_CSC_LINK is required for macOS signing."
            exit 1
          fi
          cert_dir="$(mktemp -d "$RUNNER_TEMP/macos-cert.XXXXXX")"
          trap 'rm -rf "$cert_dir"' EXIT
          printf '%s' "$MACOS_CSC_LINK" | base64 --decode > "$cert_dir/cert.p12"
          if ! openssl pkcs12 -in "$cert_dir/cert.p12" -nokeys -passin env:MACOS_CSC_KEY_PASSWORD > "$cert_dir/chain.pem"; then
            openssl pkcs12 -legacy -in "$cert_dir/cert.p12" -nokeys -passin env:MACOS_CSC_KEY_PASSWORD > "$cert_dir/chain.pem"
          fi
          openssl x509 -in "$cert_dir/chain.pem" -out "$cert_dir/cert.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$cert_dir/cert.pem"

      # Self-signed builds support Squirrel updates but are not notarized.
      - name: Build self-signed desktop artifact
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: ${{ steps.resource_monitor_cache.outputs.cache-hit == 'true' }}
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
        run: |
          vp run dist:desktop:artifact \
            --platform mac \
            --target dmg \
            --arch "${{ matrix.arch }}" \
            --build-version "${{ inputs.version }}" \
            --self-signed \
            --verbose

      - name: Verify application signature
        shell: bash
        run: |
          set -euo pipefail
          verify_dir="$(mktemp -d "$RUNNER_TEMP/macos-verify.XXXXXX")"
          trap 'rm -rf "$verify_dir"' EXIT
          shopt -s nullglob
          archives=(release/*.zip)
          [[ ${#archives[@]} -eq 1 ]] || { echo "::error::Expected one macOS ZIP"; exit 1; }
          ditto -x -k "${archives[0]}" "$verify_dir"
          apps=("$verify_dir"/*.app)
          [[ ${#apps[@]} -eq 1 ]] || { echo "::error::Expected one application in ZIP"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "${apps[0]}"
          requirement="$(codesign -d -r- "${apps[0]}" 2>&1)"
          printf '%s\n' "$requirement"
          if ! grep -Eq 'certificate (leaf|root) = H"' <<< "$requirement"; then
            echo "::error::Application lacks a certificate-based designated requirement."
            exit 1
          fi

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish

          shopt -s nullglob
          for pattern in "release/*.dmg" "release/*.zip" "release/*.blockmap" "release/latest-mac.yml" "release/nightly-mac.yml"; do
            # Literal manifest names survive nullglob, so skip the channel this build did not emit.
            for file in $pattern; do
              if [[ -e "$file" ]]; then cp "$file" release-publish/; fi
            done
          done

          # Both arches emit the same updater manifest name. Suffix the x64
          # copy so the release job can merge it into the arm64 manifest.
          if [[ "${{ matrix.arch }}" != "arm64" ]]; then
            for manifest in release-publish/*-mac.yml; do
              mv "$manifest" "${manifest%.yml}-${{ matrix.arch }}.yml"
            done
          fi

      - name: Upload macOS release assets
        uses: actions/upload-artifact@v7
        with:
          name: desktop-mac-${{ matrix.arch }}
          path: release-publish/*
          if-no-files-found: error
